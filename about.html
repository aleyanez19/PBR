<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Vista</title>

    <style>
        :root {
            --black: #0a0a0a;
            --burgundy: #4a1020;
            --cream: #e8e4d9;
            --gray: #d6d6d3;
            --ink: #251015;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--cream);
            color: var(--ink);
            animation: pageIn .5s ease-out;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .top-nav {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--black);
            display: flex;
            justify-content: center;
            gap: 38px;
            padding: 20px;
        }

        .top-nav a {
            font-weight: 900;
            text-transform: uppercase;
            color: var(--cream);
            font-size: .8rem;
            position: relative;
            transition: .3s;
        }

        .top-nav a:after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -7px;
            width: 0;
            height: 2px;
            background: var(--burgundy);
            transition: .3s;
        }

        .top-nav a:hover {
            color: #fff;
        }

        .top-nav a:hover:after,
        .top-nav a.active:after {
            width: 100%;
        }

        .hero {
            background: var(--black);
            color: var(--cream);
            min-height: 72vh;
            padding: 70px 7vw;
            display: grid;
            grid-template-columns: 1.3fr .7fr;
            gap: 50px;
            align-items: center;
            position: relative;
        }

        .hero:after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 12vh;
            background: var(--burgundy);
        }

        h1 {
            font-family: "Arial Black", Impact, sans-serif;
            font-size: clamp(3.8rem, 9vw, 9rem);
            letter-spacing: -.07em;
            line-height: .85;
            margin: 0;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
        }

        .logoMark {
            display: inline-grid;
            place-items: center;
            border: 4px solid var(--cream);
            border-radius: 50%;
            width: 88px;
            height: 88px;
            margin-left: 16px;
            vertical-align: middle;
            overflow: hidden;
            background: transparent;
        }

        .logoMark img {
            width: 70px;
            height: auto;
            display: block;
        }

        p {
            line-height: 1.5;
            position: relative;
            z-index: 2;
        }

        .imgbox {
            min-height: 420px;
            border: 4px solid var(--cream);
            background: var(--burgundy);
            padding: 0;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .imgbox img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .film {
            height: 70px;
            background: repeating-linear-gradient(90deg, var(--cream) 0 38px, var(--burgundy) 38px 78px);
            border-bottom: 35px solid var(--burgundy);
        }

        .scrap {
            background: var(--burgundy);
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 76vh;
        }

        .photo {
            background: #ddd;
            overflow: hidden;
            filter: grayscale(1);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .papers {
            position: relative;
            background: var(--burgundy);
            overflow: hidden;
        }

        .paper {
            position: absolute;
            background: #e8d7ad;
            box-shadow: 0 12px 30px rgba(0, 0, 0, .16);
        }

        .paper.one {
            width: 300px;
            height: 210px;
            top: 100px;
            left: 90px;
            transform: rotate(-8deg);
        }

        .paper.two {
            width: 260px;
            height: 230px;
            top: 230px;
            left: 280px;
            background: #f0efe8;
            transform: rotate(6deg);
            background-image: repeating-linear-gradient(0deg, transparent 0 28px, #aec2d7 29px 30px);
        }

        .logoLarge {
            position: absolute;
            bottom: 80px;
            left: 150px;
            border: 5px solid var(--cream);
            border-radius: 50%;
            width: 130px;
            height: 130px;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .logoLarge img {
            width: 105px;
            height: auto;
            display: block;
        }

        .contact {
            background: var(--gray);
            padding: 70px 7vw;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .contact h2 {
            font-family: "Arial Black", Impact, sans-serif;
            font-size: clamp(3.5rem, 8vw, 8rem);
            letter-spacing: -.07em;
            margin: 0;
        }

        .contact form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .contact label {
            font-weight: 900;
        }

        .contact input,
        .contact textarea {
            border: 0;
            background: #fff;
            padding: 15px;
            font: inherit;
        }

        .contact textarea {
            min-height: 160px;
            resize: vertical;
        }

        .btn {
            border: 0;
            background: var(--burgundy);
            color: var(--cream);
            border-radius: 999px;
            padding: 14px 22px;
            font-weight: 900;
            text-transform: uppercase;
            transition: .25s;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--black);
            transform: scale(1.03);
        }

        .footer {
            background: var(--burgundy);
            color: var(--cream);
            display: flex;
            justify-content: space-between;
            gap: 18px;
            padding: 30px 7vw;
            font-size: .9rem;
        }

        @media(max-width:850px) {

            .hero,
            .scrap,
            .contact {
                grid-template-columns: 1fr;
            }

            .top-nav {
                flex-wrap: wrap;
                gap: 16px;
            }

            .footer {
                flex-direction: column;
            }

            .paper.one {
                left: 30px;
            }

            .paper.two {
                left: 110px;
            }
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="about.html">About</a>
        <a href="to-do.html">To-Do</a>
    </nav>

    <section class="hero">
        <div>
            <div style="margin-bottom:60px;display:flex;gap:44px;font-size:.9rem">
                <span>Dashboard</span>
                <span>To-do</span>
                <span>Reportes</span>
                <span>General</span>
            </div>

            <h1>
                About Vista
                <span class="logoMark">
                    <img src="assets/logovistas.jpg" alt="Vista logo">
                </span>
            </h1>

            <p>Empresa dedicada a la producción y comercialización de uvas de calidad.</p>
        </div>

        <div class="imgbox">
            <img src="assets/uvas.jpg" alt="Uvas moradas">
        </div>
    </section>

    <div class="film"></div>

    <section class="scrap">
        <div class="photo">
            <img src="assets/PEDRO.jpg" alt="Pedro en viñedo">
        </div>

        <div class="papers">
            <div class="paper one"></div>
            <div class="paper two"></div>

            <div class="logoLarge">
                <img src="assets/logovistas.jpg" alt="Vista logo">
            </div>
        </div>
    </section>

    <section class="contact">
        <h2>Contact</h2>

        <form id="contactForm">
            <label>Reach out</label>

            <input id="nameInput" type="text" placeholder="Name" required>

            <input id="emailInput" type="email" placeholder="Your email" required>

            <textarea id="messageInput" placeholder="Message" required></textarea>

            <button class="btn" type="submit">Send Message</button>
        </form>
    </section>

    <footer class="footer">
        <span>@pedrobaranzini</span>
        <span>pbaranzini@vistavineyards.com</span>
        <span>License MT · Made by AYZ</span>
    </footer>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("nameInput").value.trim();
            const email = document.getElementById("emailInput").value.trim();
            const message = document.getElementById("messageInput").value.trim();

            const recipient = "pbaranzini@vistavineyards.com";
            const subject = `Message from ${name} - GrapeTrack`;
            const body = `Name: ${name}
Email: ${email}

Message:
${message}`;

            const mailtoLink = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

            window.location.href = mailtoLink;
        });
    </script>
</body>

</html>
